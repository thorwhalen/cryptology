hint = "`total = 0`, then `for c in range(4):` with `s = t[c::4]`, the counting lines, and `total = total + ioc`. After the loop, `average = total / 4`."
solution = '''
vigenere = """{{vigenere}}"""
t = "".join(ch for ch in vigenere if ch.isalpha()).upper()
total = 0
for c in range(4):
    s = t[c::4]
    counts = {}
    for ch in s:
        counts[ch] = counts.get(ch, 0) + 1
    N = len(s)
    total = total + sum(n * (n - 1) for n in counts.values()) / (N * (N - 1))
