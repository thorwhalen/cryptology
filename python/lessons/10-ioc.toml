id = "ioc"
number = 10
title = "Measure: the index of coincidence"
job = "Work out the index of coincidence, which tells one alphabet from several."
learn = ["sum() over a loop in brackets", "dict.values()", "division", "round()"]
intro = "The index of coincidence (IoC) is the chance that two letters picked at random from the text are the same. English, and anything that only relabels or moves its letters (Caesar, substitution, transposition), is about 0.066; letters spread evenly over all 26 give about 0.038. A Vigenère cipher sits in between, and its slices `t[c::w]` look like English again at the right width. The formula is: for each letter, its count n times (n - 1), all added up, divided by N times (N - 1), where N is the length."

[predict]
question = "What does this print?"
code = '''
counts = {"A": 2, "B": 1}
N = 3
print(sum(n * (n - 1) for n in counts.values()) / (N * (N - 1)))
'''
choices = ["0.3333333333333333", "0.5", "2", "0.0"]
answer = 0
explain = "A gives 2 × 1 = 2 and B gives 1 × 0 = 0, so the top is 2; the bottom is 3 × 2 = 6. 2 / 6 is a third, which Python prints with all its digits."

[run]
code = '''
caesar = """{{caesar}}"""
vigenere = """{{vigenere}}"""

for ct in [caesar, vigenere]:
    t = "".join(ch for ch in ct if ch.isalpha()).upper()
    counts = {}
    for ch in t:
        counts[ch] = counts.get(ch, 0) + 1
    N = len(t)
    ioc = sum(n * (n - 1) for n in counts.values()) / (N * (N - 1))
    print(N, "letters, IoC", round(ioc, 3))
'''
note = "Two texts: Tom's letter (one alphabet) and a page of a logbook enciphered with a Vigenère. Run it and compare the two numbers."

