id = "rearrange"
number = 6
title = "Rearrange columns"
job = "Put the letters of every row back in order with a key: the way to undo a block transposition."
learn = ["a list of numbers as a key", "indexing with each number in a list", "joining letters in a new order"]
intro = "A block transposition shuffles every row of the grid the same way. The key to undo it is a list of positions: `order = [2, 0, 1]` means take letter 2 of the row, then letter 0, then letter 1. A columnar transposition, written in rows and read off by columns, is undone by cutting the text into equal columns and reading across them."

[predict]
question = "What does this print?"
code = '''
row = "TAC"
order = [2, 1, 0]
print("".join(row[i] for i in order))
'''
choices = ["CAT", "TAC", "ACT", "ATC"]
answer = 0
explain = "`row[2]` is C, `row[1]` is A, `row[0]` is T. Joined in that order: CAT."

[run]
code = '''
ct = """{{block}}"""
t = "".join(ch for ch in ct if ch.isalpha()).upper()
w = 6
order = [2, 0, 5, 3, 1, 4]

plain = ""
for i in range(0, len(t), w):
    row = t[i:i+w]
    fixed = "".join(row[k] for k in order)
    print(row, "->", fixed)
    plain = plain + fixed
print(plain)
'''

