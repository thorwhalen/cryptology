[make]
task = "This message was written in rows of 6 letters and read off by columns, left to right, with no key. Undo it: cut `t` into 6 equal columns of `n = len(t) // 6` letters, then read across them, row by row. Make the result `plain`."
code = '''
ct = """{{columnar}}"""
t = "".join(ch for ch in ct if ch.isalpha()).upper()
n = len(t) // 6        # how many letters in each column
cols = [t[i*n:(i+1)*n] for i in range(6)]
print(cols)
# now read across: row r is cols[0][r], cols[1][r], ... cols[5][r]
'''
check = '''
assert plain == "{{columnar_plain}}", "plain should be the message read row by row: the first letter of every column, then the second letters, and so on"
'''
hint = "Two loops: `for r in range(n):` and, inside it, `for c in range(6):`, adding `cols[c][r]` each time. Or in one line: `plain = \"\".join(t[r::n] for r in range(n))`."
solution = '''
ct = """{{columnar}}"""
t = "".join(ch for ch in ct if ch.isalpha()).upper()
n = len(t) // 6
cols = [t[i*n:(i+1)*n] for i in range(6)]
plain = ""
for r in range(n):
    for c in range(6):
        plain = plain + cols[c][r]
print(plain)
'''
