id = "functions"
number = 12
title = "Keep a tool"
job = "Wrap a job in a function, so one line runs it on any text with any key."
learn = ["def and return", "parameters", "lambda", "map(), and why it needs list() or join()"]
intro = "A function is a tool with a name. `def shift(text, k):` says what it needs; `return` hands back the answer. Once written, `shift(t, -3)` does the whole job, and a loop can try all 26 keys in two lines. `lambda` makes a small function in place, and `map` applies a function to every letter, but lazily: it does nothing until `list(...)` or `\"\".join(...)` asks for the results."

[predict]
question = "What does this print?"
code = '''
def double(s):
    return s + s

print(double("AB"), len(double("XYZ")))
'''
choices = ["ABAB 6", "AB 3", "ABAB 3", "AABB 6"]
answer = 0
explain = "`double(\"AB\")` returns AB + AB, ABAB. `double(\"XYZ\")` is XYZXYZ, six letters long."

[run]
code = '''
ct = """{{caesar}}"""
t = "".join(ch for ch in ct if ch.isalpha()).upper()

def shift(text, k):
    out = ""
    for ch in text:
        out = out + chr((ord(ch) - 65 + k) % 26 + 65)
    return out

for k in range(26):
    print(k, shift(t[:30], -k))
'''

[investigate]
prompts = [
