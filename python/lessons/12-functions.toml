  "Now print `map(up, \"HAL\")` on its own. It is a promise of letters, not the letters: `list(map(up, \"HAL\"))` makes it keep the promise.",
]

[modify]
task = "Change `shift` so a character that is not a capital letter (a space, a comma, a line break) passes through unchanged. Then make `message`, the whole of `ct` shifted back by the key you found."
code = '''
ct = """{{caesar}}"""

def shift(text, k):
    out = ""
    for ch in text:
        out = out + chr((ord(ch) - 65 + k) % 26 + 65)
    return out

message = ""   # change this line
print(message)
'''
check = '''
assert message == """{{caesar_plain}}""", "message should be the whole letter, spaces and punctuation kept: shift only the letters, and shift back by the key"
'''
hint = "Inside the loop: `if ch.isalpha():` shift it, `else:` add `ch` as it is. Then `message = shift(ct, -k)` with the key from the Run step."
solution = '''
ct = """{{caesar}}"""

def shift(text, k):
    out = ""
    for ch in text:
        if ch.isalpha():
            out = out + chr((ord(ch) - 65 + k) % 26 + 65)
        else:
            out = out + ch
    return out

message = shift(ct, -11)
print(message)
'''

[make]
task = "Write a function `ioc(text)` that returns the index of coincidence of a text of capital letters (lesson 10's formula). Then any text is one line away: `print(ioc(t))`."
code = '''
# def ioc(text):
#     ...
'''
check = '''
assert abs(ioc("AAB") - 1 / 3) < 1e-9, "ioc(\"AAB\") should be 1/3"
assert abs(ioc("ABCD")) < 1e-9, "ioc(\"ABCD\") should be 0: no letter repeats"
assert abs(ioc("AAAA") - 1) < 1e-9, "ioc(\"AAAA\") should be 1"
'''
hint = "Inside the function: count the letters into a dictionary, `N = len(text)`, and `return sum(n * (n - 1) for n in counts.values()) / (N * (N - 1))`."
solution = '''
def ioc(text):
    counts = {}
    for ch in text:
        counts[ch] = counts.get(ch, 0) + 1
    N = len(text)
    return sum(n * (n - 1) for n in counts.values()) / (N * (N - 1))

print(ioc("AAB"), ioc("HELLOTHERE"))
'''
