id = "slice"
number = 3
title = "Look at parts of it"
job = "Take pieces of the text by position: the start, the end, every fifth letter."
learn = ["indexing: t[0], t[-1]", "slices: t[a:b]", "reversing: t[::-1]", "step slices: t[c::w]"]
intro = "Positions count from 0, and negative positions count from the end. A slice `t[a:b]` takes positions a up to (not including) b. The step slice `t[c::w]` takes every w-th letter, starting at position c: it is how you pull out the columns of a grid and the slices of a Vigenère text, so it is the most useful line in this whole course."

[predict]
question = "What does this print?"
code = '''
t = "ABCDEFGHIJ"
print(t[1::3])
'''
choices = ["BEH", "ADGJ", "BCD", "CFI"]
answer = 0
explain = "Start at position 1 (B), then take every third letter: positions 1, 4 and 7, which are B, E and H."

[run]
code = '''
ct = """{{caesar}}"""
t = "".join(ch for ch in ct if ch.isalpha()).upper()   # the cleaning line from lesson 2

print(t[0], t[-1])     # the first and the last letter
print(t[:30])          # the first 30 letters
print(t[-10:])         # the last 10
print(t[::-1][:30])    # the text read backwards, its first 30 letters
print(t[0::5])         # every fifth letter, from the first
'''

[investigate]
prompts = [
  "Change `t[0::5]` to `t[1::5]`, then to `t[4::5]`. Between them, what do the five slices `t[0::5]` to `t[4::5]` cover?",
  "What does `t[5:10]` print? Which positions are those?",
  "Try `t[::2]` and `t[1::2]`. How are they related to `t`?",
]

[modify]
task = "Make `last_word` the last three letters of `t`. (The letter is signed: these three letters are the name, in cipher.)"
code = '''
ct = """{{caesar}}"""
t = "".join(ch for ch in ct if ch.isalpha()).upper()
last_word = t[:3]   # these are the first three; change the slice
print(last_word)
'''
check = '''
assert last_word == t[-3:], "last_word should be the last three letters of t"
'''
hint = "Negative positions count from the end: `t[-3:]` starts three from the end and runs to the end."
solution = '''
ct = """{{caesar}}"""
t = "".join(ch for ch in ct if ch.isalpha()).upper()
last_word = t[-3:]
print(last_word)
'''

[make]
task = "Make `backwards`, the whole of `t` read from the end to the start, and `evens`, every second letter of `t` starting with the first."
code = '''
ct = """{{caesar}}"""
t = "".join(ch for ch in ct if ch.isalpha()).upper()
# your two lines here
'''
check = '''
assert backwards == t[::-1], "backwards should be t reversed"
assert evens == t[0::2], "evens should be every second letter, starting at position 0"
'''
hint = "A step of -1 walks backwards; a step of 2 skips every other letter."
solution = '''
ct = """{{caesar}}"""
t = "".join(ch for ch in ct if ch.isalpha()).upper()
backwards = t[::-1]
evens = t[0::2]
print(backwards[:20], evens[:20])
'''
